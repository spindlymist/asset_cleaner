[package]
name = "unused_assets"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
byteorder-lite = "0.1.0"
env_logger = "0.11.8"
image = "0.25.8"
imgui = { version = "0.12.0" }
imgui-sdl2-support = "0.13.0"
imgui-wgpu = "0.25.0"
kira = { version = "0.10.8", default-features = false, features = ["cpal", "ogg"] }
libc = "0.2.177"
libks = { path = "../libks/libks" }
mint = "0.5.9"
natord = "1.0.9"
png = "0.18.0"
pollster = "0.4.0"
raw-window-handle = "0.6.2"
regex = { version = "1.12.2", features = ["use_std"] }
sdl2 = { version = "0.37.0", features = ["raw-window-handle", "bundled", "static-link"] }
trash = "5.2.5"
walkdir = "2.5.0"
wgpu = "25.0.0"

[build-dependencies]
cc = "1.2.44"
