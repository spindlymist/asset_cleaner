[package]
name = "asset_cleaner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chardetng = "1.0.0"
encoding_rs = "0.8.35"
env_logger = "0.11.10"
imgui_app = { git = "https://github.com/spindlymist/imgui_app", branch = "new-imgui-bindings" }
kira = { version = "0.12.1", default-features = false, features = ["cpal", "ogg", "vorbis"] }
libks = { git = "https://github.com/spindlymist/libks", features = ["fractional-coords"] }
libks_ini = { git = "https://github.com/spindlymist/libks" }
mint = "0.5.9"
natord = "1.0.9"
regex = { version = "1.12.3", features = ["use_std"] }
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
symphonia = { version = "0.6.0", default-features = false, features = ["ogg", "vorbis"] }
trash = "5.2.6"
walkdir = "2.5.0"

[build-dependencies]
cargo-build = "1.0.0"
cc = "1.2.63"
